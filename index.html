<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guild Lust — Игровой справочник</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <header class="header">
    <div class="logo" id="logo" title="Информация">Guild<span>Lust</span></div>
    <nav class="nav" id="mainNav">
      <a id="navMain" class="active-nav">Главная</a>
    </nav>
  </header>

  <main>
    <div class="main-hero">
      <h1>Guild Lust</h1>
      <div class="tagline">от игроков для игроков</div>
      <p>Выбери игру и получи гайды, сборки и советы от сообщества</p>
    </div>
    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="close-btn" id="modalClose">&times;</button>
      <span class="emoji-big">🏆</span>
      <h2>Награды и отзывы</h2>
      <p>Наград и отзывов нет, пока мы лошары без всего.</p>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Guild Lust. Создано для фанатов игр.</p>
  </footer>

  <script src="data/games.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
