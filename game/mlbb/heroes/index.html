<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guild Lust — Герои Mobile Legends</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/heroes.css" />
</head>
<body>
  <header class="header">
    <div class="logo" id="logo" title="Информация">Guild<span>Lust</span></div>
    <nav class="nav">
      <a href="/game/mlbb/heroes/" class="active">Герои</a>
      <a href="/game/mlbb/builds/">Сборки</a>
      <a href="/game/mlbb/sovety/">Советы</a>
      <a href="/index.html" class="back-btn">← Назад</a>
    </nav>
  </header>

  <main class="heroes-page">
    <h1 class="page-title">Герои Mobile Legends</h1>
    <p class="page-subtitle">Наведи на круг, чтобы увидеть имя</p>

    <div class="heroes-grid" id="heroesGrid"></div>
  </main>

  <footer class="footer">
    <p>© 2026 Guild Lust. Создано для фанатов игр.</p>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="close-btn" id="modalClose">&times;</button>
      <span class="emoji-big">🏆</span>
      <h2>Награды и отзывы</h2>
      <p>Наград и отзывов нет, пока мы лошары без всего.</p>
    </div>
  </div>

  <script src="/js/common.js"></script>

  <script>
    var grid = document.getElementById('heroesGrid');

    for (var i = 1; i <= 150; i++) {
      var link = document.createElement('a');
      link.className = 'hero-circle';
      link.href = '#';

      link.innerHTML =
        '<div class="hero-img"></div>' +
        '<span class="hero-name">Герой ' + i + '</span>';

      grid.appendChild(link);
    }
  </script>
</body>
</html>
